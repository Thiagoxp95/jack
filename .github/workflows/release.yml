name: Release

# Bump MARKETING_VERSION/BUILD_NUMBER in version.env on main to cut a release.
# The workflow builds, packages, signs (Developer ID + notarization when the
# secrets are configured, ad-hoc otherwise), publishes a GitHub Release with
# the DMG + zip, signs the zip with the Sparkle EdDSA key, and commits the
# regenerated appcast.xml back to main — which is the update feed the app polls
# (https://raw.githubusercontent.com/<repo>/main/appcast.xml).
#
# Secrets (all optional except SPARKLE_PRIVATE_KEY):
#   SPARKLE_PRIVATE_KEY          contents of the ed25519 private key file (required for updates)
#   MACOS_CERT_P12               base64-encoded Developer ID Application .p12
#   MACOS_CERT_PASSWORD          password for the .p12
#   APP_STORE_CONNECT_API_KEY_P8 App Store Connect API key (.p8 contents, for notarization)
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID

on:
  push:
    branches: [main]
    paths: [version.env]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Read version
        id: version
        run: |
          source version.env
          echo "version=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Skip if release already published
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache SwiftPM
        if: steps.guard.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/artifacts
            .build/repositories
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-release-${{ runner.os }}-

      - name: Import signing certificate
        if: steps.guard.outputs.skip == 'false' && secrets.MACOS_CERT_P12 != ''
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "APP_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build and package
        if: steps.guard.outputs.skip == 'false'
        env:
          RELEASE_BUILD: "1"
        run: |
          Scripts/package_app.sh release
          ditto -c -k --sequesterRsrc --keepParent JackApp.app "JackApp-${{ steps.version.outputs.version }}.zip"

      - name: Notarize
        if: steps.guard.outputs.skip == 'false' && secrets.APP_STORE_CONNECT_API_KEY_P8 != ''
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "JackApp-${{ steps.version.outputs.version }}.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait
          xcrun stapler staple JackApp.app
          # Re-zip with the stapled ticket.
          rm "JackApp-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --sequesterRsrc --keepParent JackApp.app "JackApp-${{ steps.version.outputs.version }}.zip"

      - name: Make DMG
        if: steps.guard.outputs.skip == 'false'
        run: |
          mkdir -p dmg-root
          cp -R JackApp.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Jack" -srcfolder dmg-root -ov -format UDZO \
            "Jack-${{ steps.version.outputs.version }}.dmg"

      - name: Generate appcast
        if: steps.guard.outputs.skip == 'false'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY not set — skipping appcast (no auto-updates for this release)"
            exit 0
          fi
          SPARKLE_VERSION=2.9.5
          curl -sL -o sparkle.zip \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip"
          mkdir -p /tmp/sparkle && (cd /tmp/sparkle && unzip -qo "$OLDPWD/sparkle.zip")
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed25519"
          export PATH="/tmp/sparkle/bin:$PATH"
          SPARKLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/sparkle_ed25519" \
            Scripts/make_appcast.sh "JackApp-${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub Release
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "Jack-${{ steps.version.outputs.version }}.dmg" \
              "JackApp-${{ steps.version.outputs.version }}.zip" --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" \
              "Jack-${{ steps.version.outputs.version }}.dmg" \
              "JackApp-${{ steps.version.outputs.version }}.zip" \
              --title "Jack ${{ steps.version.outputs.version }}" --generate-notes --latest
          fi

      - name: Commit appcast.xml
        if: steps.guard.outputs.skip == 'false'
        run: |
          if ! git diff --quiet -- appcast.xml 2>/dev/null && [ -f appcast.xml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add appcast.xml
            git commit -m "chore: update appcast for ${{ steps.version.outputs.tag }}"
            git pull --rebase origin main
            git push origin main
          elif [ -f appcast.xml ] && ! git ls-files --error-unmatch appcast.xml >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add appcast.xml
            git commit -m "chore: add appcast for ${{ steps.version.outputs.tag }}"
            git pull --rebase origin main
            git push origin main
          fi
